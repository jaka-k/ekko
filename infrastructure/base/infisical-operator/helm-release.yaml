apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: secrets-operator
      version: '0.11.16'
      sourceRef:
        kind: HelmRepository
        name: infisical
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # Helm never upgrades CRDs on its own; this makes Flux do it on chart bumps.
    crds: CreateReplace
    remediation:
      retries: 3
  # Defaults point at Infisical Cloud (https://app.infisical.com/api) and install the CRDs.
  values: {}
